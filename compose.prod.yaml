name: projet-deploiement-prod

services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - API_BASE_URL=${API_BASE_URL}
    ports:
      - 127.0.0.1:5000:80
    depends_on:
      - api
    container_name: projet-deploiement-frontend-container
    networks:
      - projet-deploiement-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - 127.0.0.1:3041:3040
    env_file:
      - apps/api/.env.prod
    depends_on:
      prod-database:
        condition: service_healthy
      prod-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    container_name: projet-deploiement-api-container
    networks:
      - projet-deploiement-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - apps/worker/.env.prod
    depends_on:
      prod-database:
        condition: service_healthy
      prod-redis:
        condition: service_healthy
    group_add:
      - "999"
    user: "1000:1000"
    container_name: projet-deploiement-worker-container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - projet-deploiement-network

  prod-database:
    image: postgres:17-alpine
    container_name: projet-deploiement-database-container
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - projet-deploiement-database:/var/lib/postgresql/data
    env_file:
      - apps/api/.env.postgres
    networks:
      - projet-deploiement-network

  prod-redis:
    image: redis:8.10.2-alpine
    container_name: projet-deploiement-redis-container
    expose:
      - 6379
    command: /bin/sh -c "redis-server --requirepass $${REDIS_HOST_PASSWORD}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_HOST_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - projet-deploiement-redis:/data
    env_file:
      - apps/api/.env.redis
    networks:
      - projet-deploiement-network

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:1.6.2
    container_name: projet-deploiement-drizzle-gateway-container
    restart: always
    env_file:
      - apps/api/.env.gateway
    ports:
      - 127.0.0.1:4992:4983
    depends_on:
      prod-database:
        condition: service_healthy
    volumes:
      - projet-deploiement-drizzle-gateway:/app
    networks:
      - projet-deploiement-network

volumes:
  projet-deploiement-database:
    name: projet-deploiement-database

  projet-deploiement-redis:
    name: projet-deploiement-redis

  projet-deploiement-drizzle-gateway:
    name: projet-deploiement-drizzle-gateway

networks:
  projet-deploiement-network:
    name: projet-deploiement-network
