[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "labhacker-cli"
version = "0.1.0"
description = "Client CLI pour la plateforme Lab Hacker"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0"
]

[project.scripts]
labhacker = "labhacker.main:app"

[tool.setuptools.packages.find]
where = ["src"]