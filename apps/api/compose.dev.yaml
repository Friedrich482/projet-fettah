name: projet-deploiement

services:
  database:
    image: postgres:17-alpine
    container_name: projet-deploiement-dev-db
    ports:
      - 127.0.0.1:5436:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - projet-deploiement_postgres:/var/lib/postgresql/data
    env_file:
      - .env.postgres

volumes:
  projet-deploiement_postgres:
    name: projet-deploiement_postgres_db
