name: projet-deploiement

services:
  database:
    image: postgres:17-alpine
    container_name: projet-deploiement-dev-db
    ports:
      - 127.0.0.1:5436:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - projet-deploiement_postgres:/var/lib/postgresql/data
    env_file:
      - .env.postgres

  redis:
    image: redis:8.10.2-alpine
    container_name: projet-deploiement-dev-redis
    ports:
      - 127.0.0.1:6380:6379
    command: /bin/sh -c 'redis-server --requirepass "$$REDIS_HOST_PASSWORD"'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_HOST_PASSWORD" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - projet-deploiement_redis:/data
    env_file:
      - .env.redis

volumes:
  projet-deploiement_postgres:
    name: projet-deploiement_postgres_db

  projet-deploiement_redis:
    name: projet-deploiement_redis_db
